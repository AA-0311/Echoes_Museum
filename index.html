<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes: A Museum of India's Emotions</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Museum Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/utilities.css">
    <link rel="stylesheet" href="./css/views.css?v=3">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/museum.css?v=2">

    <!-- Pannellum -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body data-theme="entrance">
    <!-- Custom Cursor -->
    <div id="flashlight-cursor"></div>
    <div id="cursor-dot"></div>

    <!-- 360 Viewer Modal -->
    <div id="viewer-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 9999;">
        <button id="close-viewer" class="interactive"
            style="position: absolute; top: 20px; right: 20px; z-index: 10000; background: var(--theme-color); color: #000; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold;">Close
            360° View</button>
        <div id="panorama" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Notification Overlay -->
    <div id="notification-overlay"
        style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid var(--theme-color); padding: 1rem 2rem; border-radius: 8px; z-index: 9000; text-align: center; color: var(--theme-color); font-weight: bold; font-family: 'Lora', serif; font-size: 1.2rem; box-shadow: 0 0 20px var(--theme-glow);">
    </div>

    <!-- Main Application Container -->
    <main id="app-root">
        <!-- Content will be injected here by JS -->
    </main>

    <!-- App Logic -->
    <script src="./js/bundle.js?v=23"></script>
</body>

</html>
